<script th:inline="javascript">
    const currentUserId = /*[[${user.userId}]]*/ 1;

    async function loadFavorites() {
        try {
            const response = await fetch(`/api/users/${currentUserId}/favorites`);
            const data = await response.json();
            const container = document.getElementById('favorites-list');
            const emptyMsg = document.getElementById('emptyFavoriteMessage');

            if (data.length === 0) {
                container.innerHTML = '';
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';
            container.innerHTML = data.map(item => `
    <div class="policy-card">
        <div class="policy-card-body">
            <span class="policy-card-category">${item.category}</span>
            <h4 class="policy-card-title">${item.title}</h4>
        </div>
        <button class="policy-card-remove" onclick="removeFavorite(${item.policyId}, this)">??젣</button>
    </div>
`).join('');
        } catch (error) { console.error('Error:', error); }
    }

    document.querySelectorAll('.mypage-side-nav a').forEach(link => {
        link.addEventListener('click', function () {
            document.querySelectorAll('.mypage-side-nav a').forEach(l => l.classList.remove('active'));
            this.classList.add('active');
        });
    });

    function removeFavorite(policyId, btn) {
        if(!confirm('愿???뺤콉?먯꽌 ??젣?섏떆寃좎뒿?덇퉴?')) return;
        fetch(`/api/users/${currentUserId}/favorites/${policyId}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok) {
                    alert("??젣?섏뿀?듬땲??");
                    btn.closest('.policy-card').remove();
                    if(document.querySelectorAll('.policy-card').length === 0)
                        document.getElementById('emptyFavoriteMessage').style.display = 'block';
                }
            });
    }

    loadFavorites();
</script>

<script>
    function updateAgeGroup() {
        const birthYearInput =
            document.getElementById("birthYear");

        const ageGroupInput =
            document.getElementById("ageGroup");

        if (!birthYearInput || !ageGroupInput) {
            return;
        }

        const birthYear = Number(birthYearInput.value);
        const currentYear = new Date().getFullYear();

        if (
            !Number.isInteger(birthYear) ||
            birthYear < 1900 ||
            birthYear > currentYear
        ) {
            ageGroupInput.value = "";
            return;
        }

        const age = currentYear - birthYear;

        if (age <= 29) {
            ageGroupInput.value = "20? ?댄븯";
        } else if (age <= 39) {
            ageGroupInput.value = "30?";
        } else if (age <= 49) {
            ageGroupInput.value = "40?";
        } else if (age <= 59) {
            ageGroupInput.value = "50?";
        } else {
            ageGroupInput.value = "60? ?댁긽";
        }
    }

    document.addEventListener(
        "DOMContentLoaded",
        updateAgeGroup
    );
</script>
