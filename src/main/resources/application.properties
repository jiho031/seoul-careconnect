spring.application.name=seoul-careconnect

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/seoulcareconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

#Email Check
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Google login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Kakao login
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Remember-me
app.security.remember-me-key=${REMEMBER_ME_KEY}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.report-photo.max-count=5

#Open AI API-key
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${OPENAI_API_KEY}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${OPENAI_MODEL:gpt-5-mini}
app.ai.prompt-version=policy-summary-v1
app.ai.max-output-tokens=8000
app.ai.assistant-max-output-tokens=${AI_ASSISTANT_MAX_OUTPUT_TOKENS:8000}

# Ollama(no use = false, use = true)
app.ai.ollama-enabled=${OLLAMA_ENABLED:true}

# 정책 조회 설정
# 목록 한 페이지에 표시할 정책 수
app.policy.query.default-page-size=4
# 비정상적으로 큰 페이지 요청 제한
app.policy.query.max-page-size=20
# 마감 임박 기준
app.policy.query.closing-soon-days=7
# 최근 등록 정책 기준
app.policy.query.new-days=14
# 첫 연동 때 호출 범위를 작게 제한(welfare.max-pages=5로 하면 매우 많이 수집됨, 추후 변경)
app.external.data-go.local-welfare.max-pages=1
app.external.data-go.local-welfare.max-detail-count=30

# 정책 API 수집 설정
# 서버 시작 시 외부 API를 한 번 수집할지 여부 (최초 수집 테스트 때만 true로 설정하고 확인 후 false로 복구)
app.policy.sync.run-on-startup=${POLICY_SYNC_RUN_ON_STARTUP:false}
# 자동 정책 수집 스케줄러 (API 수집, DB 저장, 화면 출력까지 확인한 후 운영 시 true로 변경)
# AI 토큰 사용을 위해 자동 재수집 끄고 배포
app.policy.sync.scheduler-enabled=${POLICY_SYNC_SCHEDULER_ENABLED:false}
# 날짜 계산 기준
app.policy.sync.zone-id=Asia/Seoul
# 매일 새벽 2시
app.policy.sync.cron=0 0 2 * * *
# 이미 신청이 마감된 정책은 새로 저장하지 않음
app.policy.collect.exclude-expired=true
# 종료일이 없는 상시 정책 저장
app.policy.collect.include-no-end-date=true

# 서울에서 이용 가능한 정책만 저장
app.policy.collect.seoul-only=true
# 전국 공통 정책도 서울 시민이 이용할 수 있으므로 저장
app.policy.collect.include-nationwide=true

# 오래된 마감 정책 정리 기능
app.policy.cleanup.enabled=true
# 마감 후 30일이 지난 정책을 DB에서 실제 삭제
app.policy.cleanup.delete-after-days=30

# NEW보다 D-Day 표시를 우선할 잔여기간
app.policy.query.dday-priority-days=14

# 서울 열린데이터광장 API(신청기간, 공식 원본 링크 없음)
app.external.seoul-open-data.welfare.enabled=true
app.external.seoul-open-data.api-key=${SEOUL_OPEN_DATA_API_KEY}
app.external.seoul-open-data.base-url=http://openapi.seoul.go.kr:8088
app.external.seoul-open-data.response-type=json
app.external.seoul-open-data.welfare.service-name=welfareServiceDe
app.external.seoul-open-data.welfare.start-index=1
app.external.seoul-open-data.welfare.page-size=20
app.external.seoul-open-data.welfare.max-pages=1

# 공공데이터포털 공통 설정
app.external.data-go.service-key=${DATA_GO_SERVICE_KEY}
app.external.data-go.page-no=1
app.external.data-go.num-of-rows=100
# 공공데이터포털 - 지자체 복지서비스 정보 (XML)
app.external.data-go.local-welfare.enabled=true
app.external.data-go.local-welfare.list-url=https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations/LcgvWelfarelist
app.external.data-go.local-welfare.detail-url=https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations/LcgvWelfaredetailed
app.external.data-go.local-welfare.region=서울특별시
# 공공데이터포털 - 중앙부처 복지서비스 정보(XML, 연령 제한 필요(신생아 정책도 나옴))
app.external.data-go.central-welfare.enabled=true
app.external.data-go.central-welfare.list-url=https://apis.data.go.kr/B554287/NationalWelfareInformationsV001/NationalWelfarelistV001
app.external.data-go.central-welfare.detail-url=https://apis.data.go.kr/B554287/NationalWelfareInformationsV001/NationalWelfaredetailedV001
app.external.data-go.central-welfare.list-call-type=L
app.external.data-go.central-welfare.detail-call-type=D
# 목록과 상세를 최대 20건까지만 처리
app.external.data-go.central-welfare.max-detail-count=20
# 공공데이터포털 - K-Startup 창업지원 공고 (JSON) (app.external.data-go.kstartup.target-age= 로 수정 시 모든 나이대 정책 수집)
app.external.data-go.kstartup.enabled=true
app.external.data-go.kstartup.url=https://apis.data.go.kr/B552735/kisedKstartupService01/getAnnouncementInformation01
app.external.data-go.kstartup.return-type=json
# "만 40세 이상"을 유니코드로 입력
app.external.data-go.kstartup.target-age=\uB9CC 40\uC138 \uC774\uC0C1
# 목록과 상세를 최대 20건까지만 처리
app.external.data-go.kstartup.max-pages=5
app.external.data-go.kstartup.max-results=20
# 공공데이터포털 - 마이홈 주거지원 공고 (JSON)
app.external.data-go.myhome.enabled=true
app.external.data-go.myhome.rental-url=https://apis.data.go.kr/1613000/HWSPR02/rsdtRcritNtcList
app.external.data-go.myhome.sale-url=https://apis.data.go.kr/1613000/HWSPR02/ltRsdtRcritNtcList
app.external.data-go.myhome.region-code=11

# 고용24 API (XML)
app.external.work24.return-type=XML
app.external.work24.employment-program.enabled=true
app.external.work24.employment-program.auth-key=${WORK24_EMPLOYMENT_PROGRAM_AUTH_KEY}
app.external.work24.employment-program.url=https://www.work24.go.kr/cm/openApi/call/wk/callOpenApiSvcInfo217L01.do
app.external.work24.employment-program.start-page=1
app.external.work24.employment-program.display=100

# 기업마당 API (JSON)
app.external.bizinfo.data-type=json
app.external.bizinfo.search-count=20
app.external.bizinfo.page-unit=20
app.external.bizinfo.page-index=1
app.external.bizinfo.hashtags=
# 기업마당 지원사업 공고 API
app.external.bizinfo.support.enabled=true
app.external.bizinfo.support.api-key=${BIZINFO_SUPPORT_API_KEY}
app.external.bizinfo.support.url=https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
# 카테고리 코드는 필요할 때만 지정
# 01 금융 / 02 기술 / 03 인력 / 04 수출
# 05 내수 / 06 창업 / 07 경영 / 09 기타
app.external.bizinfo.support.category-code=
# 기업마당 행사정보 API
app.external.bizinfo.event.enabled=true
app.external.bizinfo.event.api-key=${BIZINFO_EVENT_API_KEY}
app.external.bizinfo.event.url=https://www.bizinfo.go.kr/uss/rss/bizinfoEventApi.do
# 카테고리 코드는 필요할 때만 지정
app.external.bizinfo.event.category-code=

# 공식 정책 원문 제출서류 보강
# 전체 서류 병합 기능 ON/OFF
app.policy.documents.enrichment-enabled=${POLICY_DOCUMENTS_ENRICHMENT_ENABLED:true}
# officialUrl 공식 HTML 조회 여부
app.policy.documents.fetch-official-page=${POLICY_DOCUMENTS_FETCH_OFFICIAL_PAGE:true}
# API 서류가 있어도 공식 원문을 확인하여 누락 서류 보강
app.policy.documents.fetch-when-api-documents-exist=${POLICY_DOCUMENTS_FETCH_WHEN_API_DOCUMENTS_EXIST:true}
# 공식 사이트 한 곳의 최대 연결 대기 시간(밀리초)
app.policy.documents.connect-timeout-ms=${POLICY_DOCUMENTS_CONNECT_TIMEOUT_MS:5000}
# 서류 보강 로그 수준
logging.level.com.seoulcareconnect.service.impl.policy.PolicyDocumentEnrichmentService=${POLICY_DOCUMENTS_LOG_LEVEL:INFO}