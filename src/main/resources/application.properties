spring.application.name=seoulcareconnect

spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=jdbc:mariadb://localhost:3306/seoulcareconnect
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.thymeleaf.cache=false

#Email Check
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Google login
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Kakao login
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Remember-me
app.security.remember-me-key=seoul-careconnect-remember-me-key-2026-long-secret
server.servlet.session.timeout=30m

app.policy.query.default-page-size=4
app.policy.query.max-page-size=20
app.policy.query.closing-soon-days=7
app.policy.query.new-days=14
app.external.data-go.local-welfare.max-pages=1
app.external.data-go.local-welfare.max-detail-count=30

app.policy.sync.run-on-startup=true
app.policy.sync.scheduler-enabled=false
app.policy.sync.zone-id=Asia/Seoul
app.policy.sync.cron=0 0 2 * * *
app.policy.collect.exclude-expired=true
app.policy.collect.include-no-end-date=true

app.policy.cleanup.enabled=true
app.policy.cleanup.hide-after-days=30

