<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정책 찾기 | 서울 케어넥트</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/policy-list.css}" href="/css/policy-list.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="policy-list-page">
    <section class="policy-hero">
        <div class="policy-container">
            <span class="eyebrow">서울 복지·지원정책 통합 검색</span>
            <h1>내 상황에 맞는 정책을<br>쉽게 찾아보세요</h1>
            <p>지역, 생애주기, 분야, 지원 대상 조건을 선택하고 서울시와 자치구 정책을 한 번에 확인할 수 있습니다.</p>

            <form class="search-filter-card" action="#" method="get" aria-label="정책 검색 조건">
                <div class="policy-search-row">
                    <label class="sr-only" for="policyKeyword">정책 검색어</label>
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 28 28" focusable="false">
                            <circle cx="12" cy="12" r="8"></circle>
                            <path d="M18.5 18.5L25 25"></path>
                        </svg>
                    </span>
                    <input id="policyKeyword" type="search" placeholder="찾고 싶은 정책을 검색하세요. 예: 청년 월세, 출산 지원, 주거 지원">
                    <button type="button">검색</button>
                </div>

                <div class="filter-grid">
                    <div class="filter-field">
                        <label for="region">지역</label>
                        <select id="region">
                            <option>전체</option>
                            <option>서울시 전체</option>
                            <option>강남구</option>
                            <option>노원구</option>
                            <option>동대문구</option>
                            <option>마포구</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="lifeCycle">생애주기</label>
                        <select id="lifeCycle">
                            <option>전체</option>
                            <option>청년</option>
                            <option>중장년</option>
                            <option>노년</option>
                            <option>영유아</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="category">분야</label>
                        <select id="category">
                            <option>전체</option>
                            <option>일자리</option>
                            <option>주거</option>
                            <option>생활지원</option>
                            <option>교육</option>
                            <option>돌봄</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="target">지원 대상</label>
                        <select id="target">
                            <option>전체</option>
                            <option>청년</option>
                            <option>중장년</option>
                            <option>어르신</option>
                            <option>1인가구</option>
                            <option>저소득층</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="status">신청 상태</label>
                        <select id="status">
                            <option>전체</option>
                            <option>신청 가능</option>
                            <option>최근 등록</option>
                            <option>마감</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="sort">정렬</label>
                        <select id="sort">
                            <option>마감임박순</option>
                            <option>최신순</option>
                            <option>인기순</option>
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button class="reset-btn" type="button">초기화</button>
                    </div>
                </div>

            </form>
        </div>
    </section>

    <section class="result-section">
        <div class="policy-container">
            <div class="result-head">
                <div>
                    <h2>정책 검색 결과</h2>
                    <p>총 <strong th:text="${policyList != null ? policyList.size() : 0}">128</strong>개의 정책이 검색되었습니다.</p>
                </div>
                <div class="result-tabs" aria-label="빠른 보기">
                    <a href="#" class="active">전체</a>
                    <a href="#">신청 가능</a>
                    <a href="#">최근 등록</a>
                </div>
            </div>

            <div class="policy-card-list">
                <!-- [수정] 카드 1개만 th:each로 반복. user.id -> user.userId로 수정, 괄호 누락 수정 -->
                <article class="policy-result-card" th:each="policy : ${policyList}">
                    <div class="card-top">
                        <div class="policy-badges">
                            <span class="badge status" th:text="${policy.status != null ? policy.status : '신청가능'}">신청가능</span>
                        </div>
                        <button class="bookmark-btn" type="button"
                                th:attr="data-user-id=${user != null ? user.userId : ''}, data-policy-id=${policy.id}"
                                onclick="handleFavoriteClick(this)">
                            관심 저장
                        </button>
                    </div>
                    <h3><a th:href="@{'/policies/detail/' + ${policy.id}}" th:text="${policy.title}">정책명</a></h3>
                    <p class="agency" th:text="${policy.agency}">주관기관</p>
                    <p class="summary" th:text="${policy.summary}">정책 요약 내용</p>
                    <dl class="info-grid">
                        <div>
                            <dt>지역</dt>
                            <dd th:text="${policy.region}">서울시 전체</dd>
                        </div>
                        <div>
                            <dt>분야</dt>
                            <dd th:text="${policy.category}">일자리</dd>
                        </div>
                    </dl>
                    <div class="card-bottom">
                        <div class="tags">
                            <span th:if="${policy.category != null}" th:text="${policy.category}">분야</span>
                            <span th:if="${policy.region != null}" th:text="${policy.region}">지역</span>
                        </div>
                        <a class="detail-btn" th:href="@{'/policies/detail/' + ${policy.id}}">상세 보기</a>
                    </div>
                </article>

                <p th:if="${policyList == null || policyList.isEmpty()}" style="padding:40px 0; color:#6b7b99; font-weight:700;">
                    검색된 정책이 없습니다.
                </p>
            </div>

            <nav class="pagination" aria-label="페이지 이동">
                <a href="#" class="disabled">이전</a>
                <a href="#" class="active">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">다음</a>
            </nav>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function handleFavoriteClick(btn) {
        const userId = btn.dataset.userId;
        const policyId = btn.dataset.policyId;
        addFavorite(userId, policyId, btn);
    }

    function addFavorite(userId, policyId, btn) {
        if (!userId) {
            alert("로그인 후 이용 가능합니다.");
            return;
        }

        fetch(`/api/users/${userId}/favorites/${policyId}`, {
            method: 'POST'
        })
            .then(response => {
                if (response.ok) {
                    alert("관심 정책에 추가되었습니다!");
                    btn.innerText = "찜 완료";
                    btn.disabled = true;
                } else if (response.status === 409) {
                    alert("이미 관심 정책으로 등록된 정책입니다.");
                } else {
                    alert("오류가 발생했습니다.");
                }
            })
            .catch(error => console.error('Error:', error));
    }
</script>
<script th:src="@{/js/common.js}" src="/js/common.js"></script>
</body>
</html>
