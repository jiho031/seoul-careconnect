<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관심 정책 | 서울 케어넥트</title>

    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
    <link rel="stylesheet" th:href="@{/css/favorite.css}" href="/css/favorite.css">
    <link rel="stylesheet" th:href="@{/css/senior-mode.css}" href="/css/senior-mode.css">
</head>

<body th:classappend="${#strings.equalsIgnoreCase(currentUiMode, 'LARGE_TEXT')
        ? 'large-text-mode'
        : ''}"
      th:attr="data-ui-mode=${currentUiMode}">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="favorite-page">

    <section class="favorite-hero">
        <span class="favorite-eyebrow">FAVORITES</span>
        <h1>관심 정책</h1>
        <p th:text="|찜한 정책 ${favorites != null ? #lists.size(favorites) : 0}건을 모아봤어요.|">
            찜한 정책을 모아봤어요.
        </p>
    </section>

    <section class="favorite-list-section">
        <div class="board-head">
            <h2>찜한 정책</h2>
            <a href="/mypage#favorites">마이페이지에서 관리 ›</a>
        </div>

        <div class="favorite-grid" id="favoriteGrid">
            <div class="policy-card favorite-card"
                 th:each="fav : ${favorites}"
                 th:attr="data-policy-id=${fav.policyId}">

                <a class="favorite-card-link favorite-preview-target"
                   th:href="@{|/policies/${fav.policyId}|}"
                   th:attr="
                       data-preview-title=${fav.title},
                       data-preview-category=${fav.categoryLabel},
                       data-preview-agency=${fav.agency},
                       data-preview-region=${fav.regionDisplay},
                       data-preview-target=${fav.target},
                       data-preview-status=${fav.applyStatusLabel},
                       data-preview-period=${fav.applyPeriod},
                       aria-label=${fav.title}">

                    <div class="policy-card-top">
                        <span class="policy-dday"
                              th:if="${fav.dDayLabel != null}"
                              th:classappend="${fav.dDayCssClass}"
                              th:text="${fav.dDayLabel}">
                            D-5
                        </span>

                        <span class="policy-card-category" th:text="${fav.categoryLabel}">카테고리</span>
                    </div>

                    <h3 class="policy-card-title" th:text="${fav.title}" th:title="${fav.title}">정책명</h3>

                    <p class="policy-card-summary"
                       th:if="${fav.summary != null}"
                       th:text="${fav.summary}">
                        정책 요약 설명이 들어갑니다.
                    </p>

                    <div class="policy-meta" th:if="${fav.applyPeriod != null}">
                        <span class="policy-status" th:text="${fav.applyStatusLabel}">신청 가능</span>
                        <span class="policy-meta-label">신청 기간</span>
                        <span class="policy-meta-divider"></span>
                        <span class="policy-date" th:text="${fav.applyPeriod}">공고 확인</span>
                    </div>
                </a>

                <button class="policy-card-remove"
                        type="button"
                        th:attr="data-policy-id=${fav.policyId}"
                        onclick="removeFavorite(this)">
                    삭제
                </button>
            </div>
        </div>

        <p class="favorite-empty"
           id="emptyFavoriteMessage"
           th:if="${favorites == null or #lists.isEmpty(favorites)}">
            아직 찜한 정책이 없어요. 마음에 드는 정책을 찜해보세요!
        </p>
    </section>

    <section class="policy-section recommend-section">
        <div class="board-head">
            <h2>이런 정책은 어떠세요?</h2>
            <a th:href="@{/policies}">전체 정책 보기 ›</a>
        </div>

        <div class="deadline-grid">
            <a class="policy-card favorite-preview-target"
               th:each="policy : ${recommendedPolicies}"
               th:href="@{|/policies/${policy.policyId}|}"
               th:attr="
                   data-preview-title=${policy.title},
                   data-preview-category=${policy.categoryLabel},
                   data-preview-agency=${policy.agency},
                   data-preview-region=${policy.regionDisplay},
                   data-preview-target=${policy.target},
                   data-preview-status=${policy.applyStatusLabel},
                   data-preview-period=${policy.applyPeriod},
                   aria-label=${policy.title}">

                <div class="policy-card-top">
                    <span class="policy-dday"
                          th:classappend="${policy.dDayCssClass}"
                          th:text="${policy.dDayLabel}">
                        D-5
                    </span>

                    <strong class="policy-title" th:text="${policy.title}" th:title="${policy.title}">정책명</strong>
                </div>

                <div class="policy-meta">
                    <span class="policy-status" th:text="${policy.applyStatusLabel}">신청 가능</span>
                    <span class="policy-meta-label">신청 기간</span>
                    <span class="policy-meta-divider"></span>
                    <span class="policy-date" th:text="${policy.applyPeriod}" th:title="${policy.applyPeriod}">공고 확인</span>
                </div>
            </a>

            <p class="policy-empty"
               th:if="${recommendedPolicies == null or #lists.isEmpty(recommendedPolicies)}">
                아직 추천할 정책이 없습니다.
            </p>
        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- 관심 정책 카드 간단 미리보기 -->
<aside class="popular-policy-preview"
       id="favoritePolicyPreview"
       role="tooltip"
       aria-hidden="true">

    <div class="popular-policy-preview-head">

        <span class="popular-policy-preview-category"
              data-preview-field="category">
            분야
        </span>

        <span class="popular-policy-preview-status"
              data-preview-field="status">
            신청 상태
        </span>

    </div>

    <strong class="popular-policy-preview-title"
            data-preview-field="title">
        정책명
    </strong>

    <dl class="popular-policy-preview-info">

        <div data-preview-row="agency">
            <dt>기관</dt>
            <dd data-preview-field="agency"></dd>
        </div>

        <div data-preview-row="region">
            <dt>지역</dt>
            <dd data-preview-field="region"></dd>
        </div>

        <div data-preview-row="target">
            <dt>대상</dt>
            <dd data-preview-field="target"></dd>
        </div>

        <div data-preview-row="period">
            <dt>신청 기간</dt>
            <dd data-preview-field="period"></dd>
        </div>

    </dl>

    <p class="popular-policy-preview-guide">
        클릭하면 정책 상세 내용을 확인할 수 있습니다.
    </p>

</aside>

<script th:src="@{/js/favorite.js}"
        src="/js/favorite.js"></script>

<script th:inline="javascript">
    const currentUserId = /*[[${user.userId}]]*/ 1;

    function removeFavorite(btn) {
        const policyId = btn.getAttribute('data-policy-id');

        if (!confirm('관심 정책에서 삭제하시겠습니까?')) return;

        fetch(`/api/users/${currentUserId}/favorites/${policyId}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok) {
                    const card = btn.closest('.favorite-card');
                    card.remove();

                    if (document.querySelectorAll('.favorite-card').length === 0) {
                        document.getElementById('emptyFavoriteMessage').style.display = 'block';
                    }
                } else {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            });
    }
</script>

</body>
</html>
